spring:
  application:
    name: cadence
  # Mọi môi trường dùng chung cấu trúc này; chỉ giá trị biến khác nhau (infra/.env hoặc biến môi trường thật).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cadence}
    username: cadence_app # ứng dụng = nhân viên: chỉ đọc/ghi dữ liệu (ADR-0014)
    password: ${CADENCE_APP_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Hibernate chỉ kiểm tra bảng, không bao giờ tự sửa (ADR-0011)
  flyway:
    locations: classpath:db/migration
    default-schema: flyway # bảng lịch sử của Flyway nằm trong phòng riêng "flyway"
    user: cadence_migrator # Flyway = thủ kho: được tạo/sửa bảng
    password: ${CADENCE_MIGRATOR_PASSWORD}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # Mọi API (kể cả actuator) nằm dưới /api, khớp với Caddy chuyển /api/* vào backend (ADR-0006)
    context-path: /api

management:
  endpoint:
    health:
      probes:
        enabled: true # bật /health/liveness và /health/readiness
      group:
        readiness:
          include: readinessState,db # sẵn sàng = ứng dụng đã khởi động xong + database kết nối được

logging:
  structured:
    format:
      console: ecs # log dạng JSON (chuẩn ECS) cho server; MDC tự thành field "correlationId"
