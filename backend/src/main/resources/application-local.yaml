# Profile "local": chạy trên máy cá nhân với Postgres trong Docker (infra/compose.yaml).
# Bật bằng biến môi trường SPRING_PROFILES_ACTIVE=local.
spring:
  config:
    # Đọc infra/.env, cùng file Docker Compose dùng. Biến môi trường thật luôn thắng.
    # Đường dẫn tính từ thư mục backend (thư mục làm việc khi chạy).
    import: optional:file:../infra/.env[.properties]
  flyway:
    locations: classpath:db/migration,classpath:db/seed # máy cá nhân: thêm dữ liệu mẫu

springdoc:
  # Máy cá nhân: bật Swagger UI (http://localhost:<SERVER_PORT>/api/swagger-ui.html)
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

logging:
  structured:
    format:
      console: "" # máy cá nhân: log dạng chữ cho dễ đọc
  pattern:
    correlation: "[%X{correlationId:-}] " # thêm mã vào đầu mỗi dòng log chữ
