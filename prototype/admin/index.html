<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tổng quan | Cadence Admin</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css?v=20261117-10">
  <link rel="stylesheet" href="../assets/css/styles.css?v=20261117-10">
  <link rel="stylesheet" href="../assets/css/commerce.css?v=20261117-10">
  <link rel="stylesheet" href="admin.css?v=20261117-10">
</head>
<body class="admin">
<script src="../assets/js/sprite.js?v=20261117-10"></script>
<script src="../assets/js/data.js?v=20261117-10"></script>
<script src="../assets/js/app.js?v=20261117-10"></script>
<script src="admin.js?v=20261117-10"></script>
<script>
(function () {
  var main = ADM.shell('dash');
  var DAY = 86400000;
  var orders = ADM.orders();
  var counted = function (o) { return o.status !== 'CANCELLED' && o.status !== 'PENDING_PAYMENT'; };
  var inRange = function (o, from, to) { return o.createdAt >= from && o.createdAt < to; };
  var now = Date.now(), start = new Date(); start.setHours(0, 0, 0, 0);
  var today0 = start.getTime();

  function stats(from, to) {
    var os = orders.filter(function (o) { return inRange(o, from, to); });
    var ok = os.filter(counted);
    var rev = ok.reduce(function (s, o) { return s + o.totals.total; }, 0);
    var online = os.filter(function (o) { return o.payment.method === 'vnpay'; });
    var paid = online.filter(function (o) { return ['PAID', 'REFUND_PENDING', 'REFUNDED'].indexOf(o.payment.status) > -1; });
    var cancelled = os.filter(function (o) { return o.status === 'CANCELLED' && o.cancelReason !== 'Hết hạn thanh toán'; });
    return { rev: rev, n: ok.length, aov: ok.length ? Math.round(rev / ok.length) : 0, payRate: online.length ? paid.length / online.length : 0, cancelRate: os.length ? cancelled.length / os.length : 0 };
  }
  var cur = stats(today0 - 6 * DAY, now + 1), prev = stats(today0 - 13 * DAY, today0 - 6 * DAY);
  function delta(a, b, pct) {
    if (!b) return '<span class="kpi__delta">Chưa có kỳ trước</span>';
    var d = pct ? (a - b) * 100 : (a - b) / b * 100;
    var up = d >= 0;
    return '<span class="kpi__delta"><span class="' + (up ? 'up' : 'down') + '"><svg class="icon icon--xs" aria-hidden="true"><use href="#a-' + (up ? 'up' : 'down') + '"/></svg><span class="sr-only">' + (up ? 'Tăng' : 'Giảm') + '</span>' + Math.abs(d).toFixed(1).replace('.', ',') + (pct ? ' điểm %' : '%') + '</span> so với 7 ngày trước</span>';
  }

  /* ---------- Việc cần làm ---------- */
  var toConfirm = orders.filter(function (o) { return o.status === 'PENDING_CONFIRMATION'; }).length;
  var toPack = orders.filter(function (o) { return o.status === 'PLACED' && o.fulfillment === 'UNFULFILLED'; }).length;
  var stale = orders.filter(ADM.isStalePayment).length;
  var out = ADM.stockRows().filter(function (r) { return r.ats <= 0; }).length;

  function todo(href, text, sub, n) {
    return '<a href="' + href + '"><span class="todo__text"><span>' + text + '</span>' + (sub ? '<small>' + sub + '</small>' : '') + '</span>' +
      '<span class="count' + (n ? ' is-due' : '') + '">' + n + '</span><svg class="icon" aria-hidden="true"><use href="#i-chev-r"/></svg></a>';
  }

  main.innerHTML =
    '<div class="page-head"><div><h1 class="h1">Tổng quan</h1><p>7 ngày gần nhất · cập nhật ' + ADM.when(now) + '</p></div>' +
      '<a class="btn btn--outline" href="orders.html">Xem tất cả đơn</a></div>' +

    '<section class="kpis" aria-label="Chỉ số 7 ngày">' +
      '<div class="kpi"><span class="kpi__label">Doanh thu thuần</span><span class="kpi__value">' + CAD.formatPrice(cur.rev) + '</span>' + delta(cur.rev, prev.rev) + '</div>' +
      '<div class="kpi"><span class="kpi__label">Số đơn hợp lệ</span><span class="kpi__value">' + cur.n + '</span>' + delta(cur.n, prev.n) + '</div>' +
      '<div class="kpi"><span class="kpi__label">Giá trị đơn trung bình (AOV)</span><span class="kpi__value">' + CAD.formatPrice(cur.aov) + '</span>' + delta(cur.aov, prev.aov) + '</div>' +
      '<div class="kpi"><span class="kpi__label">Thanh toán VNPay thành công</span><span class="kpi__value">' + Math.round(cur.payRate * 100) + '%</span>' + delta(cur.payRate, prev.payRate, true) + '</div>' +
    '</section>' +

    '<div class="grid-2">' +
      '<section class="card" aria-labelledby="chart-title">' +
        '<div class="card__head"><div><h2 class="h3" id="chart-title">Doanh thu thuần theo ngày</h2><p>14 ngày gần nhất · không tính đơn huỷ và đơn chưa thanh toán</p></div>' +
          '<div class="card__tools"><div class="seg" role="group" aria-label="Chỉ số"><button type="button" data-metric="rev" aria-pressed="true">Doanh thu</button><button type="button" data-metric="n" aria-pressed="false">Số đơn</button></div>' +
          '<button class="btn btn--outline btn--sm" type="button" id="table-toggle" aria-expanded="false" aria-controls="chart-table">Xem dạng bảng</button></div></div>' +
        '<div class="chart" id="chart"><div class="tip" id="tip" role="status"></div></div>' +
        '<div id="chart-table" hidden></div>' +
      '</section>' +
      '<section class="card" aria-labelledby="todo-title"><div class="card__head"><h2 class="h3" id="todo-title">Việc cần làm</h2></div><div class="todo">' +
        todo('orders.html?tab=confirm', 'Đơn COD chờ xác nhận', '', toConfirm) +
        todo('orders.html?tab=pack', 'Đơn đã xác nhận, chờ đóng gói', '', toPack) +
        todo('orders.html?tab=payment', 'Thanh toán VNPay chờ quá 15 phút', 'Cần đối soát với cổng thanh toán', stale) +
        todo('inventory.html?filter=out', 'SKU đã hết hàng', 'Cân nhắc nhập thêm hoặc ẩn size', out) +
      '</div>' +
      '<p class="foot-note">Tỷ lệ huỷ 7 ngày: <span class="mono">' + (cur.cancelRate * 100).toFixed(1).replace('.', ',') + '%</span></p></section>' +
    '</div>' +

    '<section class="card" aria-labelledby="recent-title"><div class="card__head"><h2 class="h3" id="recent-title">Đơn gần đây</h2><a class="link" href="orders.html">Tất cả đơn</a></div>' +
      '<div class="table-wrap"><table class="table table--list table--orders"><thead><tr><th class="col-sticky col-edge">Mã đơn</th><th>Thời gian</th><th>Khách hàng</th><th>Đơn hàng</th><th>Thanh toán</th><th>Giao hàng</th><th class="num">Tổng tiền</th></tr></thead><tbody>' +
      orders.slice(0, 8).map(function (o) {
        return '<tr class="is-link" data-href="order.html?n=' + o.number + '"><td class="mono col-primary col-sticky col-edge"><a href="order.html?n=' + o.number + '">' + o.number + '</a></td><td class="mono col-time">' + ADM.when(o.createdAt) + '</td><td class="col-cust">' + ADM.esc(o.address.name) + '</td>' +
          '<td class="col-badge">' + ADM.pill('order', o.status) + '</td><td class="col-badge">' + ADM.pill('pay', o.payment.status) + '</td><td class="col-badge">' + ADM.pill('ful', o.fulfillment || 'UNFULFILLED') + '</td><td class="num col-total">' + CAD.formatPrice(o.totals.total) + '</td></tr>';
      }).join('') + '</tbody></table></div></section>';

  main.addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-href]');
    if (tr && !e.target.closest('a')) location.href = tr.getAttribute('data-href');
  });

  /* ---------- Biểu đồ cột 1 chuỗi (SVG thuần) ----------
     Cột ≤ 24px, đầu cột bo 4px, đáy vuông, lưới mảnh, chỉ ghi nhãn cột cao nhất, tooltip khi rê chuột, có dạng bảng. */
  var days = [];
  for (var i = 13; i >= 0; i--) {
    var from = today0 - i * DAY, os = orders.filter(function (o) { return inRange(o, from, from + DAY) && counted(o); });
    days.push({ t: from, rev: os.reduce(function (s, o) { return s + o.totals.total; }, 0), n: os.length });
  }
  var metric = 'rev';
  function dlabel(t) { var d = new Date(t); return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function fmt(v) { return metric === 'rev' ? CAD.formatPrice(v) : v + ' đơn'; }
  function niceMax(v) {
    if (!v) return metric === 'rev' ? 1e6 : 4;
    var p = Math.pow(10, Math.floor(Math.log10(v))), m = v / p;
    var step = m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10;
    return step * p;
  }
  function draw() {
    var box = document.getElementById('chart');
    var W = Math.max(280, box.clientWidth), H = 240, padL = 52, padB = 26, padT = 18;
    var max = niceMax(Math.max.apply(null, days.map(function (d) { return d[metric]; })));
    var plotW = W - padL, plotH = H - padB - padT, band = plotW / days.length, bw = Math.min(24, band - 2);
    var y = function (v) { return padT + plotH - v / max * plotH; };
    var ticks = [0, max / 4, max / 2, max * 3 / 4, max];
    var peak = days.reduce(function (a, b) { return b[metric] > a[metric] ? b : a; }, days[0]);
    var every = W < 520 ? 2 : 1;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ ' + (metric === 'rev' ? 'doanh thu' : 'số đơn') + ' 14 ngày; cao nhất ' + dlabel(peak.t) + ': ' + fmt(peak[metric]) + '">' +
      '<g class="grid">' + ticks.map(function (t) { return '<line x1="' + padL + '" x2="' + W + '" y1="' + y(t) + '" y2="' + y(t) + '"/>'; }).join('') + '</g>' +
      '<g class="axis">' + ticks.map(function (t) { return '<text x="' + (padL - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + (metric === 'rev' ? (t ? ADM.short(t) : '0') : Math.round(t)) + '</text>'; }).join('') +
        days.map(function (d, i) { return i % every ? '' : '<text x="' + (padL + band * i + band / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + dlabel(d.t) + '</text>'; }).join('') + '</g>' +
      days.map(function (d, i) {
        var x = padL + band * i + (band - bw) / 2, top = y(d[metric]), h = Math.max(0, padT + plotH - top), r = Math.min(4, h);
        var path = h ? 'M' + x + ',' + (padT + plotH) + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + 'V' + (padT + plotH) + 'Z' : '';
        return '<rect class="bar-hit" x="' + (padL + band * i) + '" y="' + padT + '" width="' + band + '" height="' + plotH + '" data-i="' + i + '"/>' +
          (path ? '<path class="bar" d="' + path + '"/>' : '') +
          (d === peak && d[metric] ? '<text class="peak" x="' + (x + bw / 2) + '" y="' + (top - 6) + '" text-anchor="middle">' + (metric === 'rev' ? ADM.short(d.rev) : d.n) + '</text>' : '');
      }).join('') + '</svg>';
    box.innerHTML = '<div class="tip" id="tip" role="status"></div>' + svg;
    var tip = document.getElementById('tip');
    box.querySelectorAll('.bar-hit').forEach(function (h) {
      h.addEventListener('mouseenter', function () {
        var d = days[+h.getAttribute('data-i')];
        var bar = h.nextElementSibling; if (bar && bar.classList.contains('bar')) bar.classList.add('is-hover');
        tip.innerHTML = dlabel(d.t) + '<br>Doanh thu <b>' + CAD.formatPrice(d.rev) + '</b><br>Số đơn <b>' + d.n + '</b>';
        tip.style.left = (padL + band * (+h.getAttribute('data-i')) + band / 2) / W * 100 + '%';
        tip.style.top = y(d[metric]) + 'px';
        tip.classList.add('is-on');
      });
      h.addEventListener('mouseleave', function () { tip.classList.remove('is-on'); box.querySelectorAll('.bar.is-hover').forEach(function (b) { b.classList.remove('is-hover'); }); });
    });
    document.getElementById('chart-table').innerHTML = '<div class="table-wrap"><table class="table"><caption class="sr-only">Doanh thu và số đơn theo ngày</caption><thead><tr><th>Ngày</th><th class="num">Doanh thu thuần</th><th class="num">Số đơn</th></tr></thead><tbody>' +
      days.slice().reverse().map(function (d) { return '<tr><td class="mono">' + dlabel(d.t) + '</td><td class="num">' + CAD.formatPrice(d.rev) + '</td><td class="num">' + d.n + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  document.querySelectorAll('[data-metric]').forEach(function (b) {
    b.addEventListener('click', function () {
      metric = b.getAttribute('data-metric');
      document.querySelectorAll('[data-metric]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      document.getElementById('chart-title').textContent = metric === 'rev' ? 'Doanh thu thuần theo ngày' : 'Số đơn hợp lệ theo ngày';
      draw();
    });
  });
  document.getElementById('table-toggle').addEventListener('click', function () {
    var t = document.getElementById('chart-table'), open = t.hidden;
    t.hidden = !open; this.setAttribute('aria-expanded', open); this.textContent = open ? 'Ẩn bảng' : 'Xem dạng bảng';
  });
  window.addEventListener('resize', draw);
  draw();
})();
</script>
</body>
</html>
