# Local stack (SRS NFR-MNT-03).
#   Whole system:          docker compose up --build        → http://localhost:${HTTP_PORT:-8080}
#   Only DB + mail for IDE: docker compose up db mail        → run backend with profile "dev", frontend with npm run dev
# Passwords come from .env (copy .env.example). They are for this machine only.
name: cadence

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cadence"]
      interval: 5s
      timeout: 3s
      retries: 20

  mail:
    image: axllent/mailpit:v1.34.0
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"   # web UI to read the emails the app "sent"
      - "${SMTP_PORT:-1025}:1025"   # SMTP

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/cadence
      DB_APP_USER: cadence_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_OWNER_USER: cadence_owner
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      API_DOCS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8080/api
    depends_on:
      backend:
        condition: service_healthy   # page renders call the backend

  nginx:
    image: nginx:1.30.8-alpine        # stable branch; Dependabot proposes updates
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  db-data:
