# Cả hệ thống trên máy cá nhân: Postgres + API + Web + Nginx (mở http://localhost). Mọi giá trị đọc từ .env cùng thư mục (mẫu: .env.example).
#   docker compose -f infra/compose.yaml up -d       bật (tạo 2 tài khoản ở lần đầu)
#   docker compose -f infra/compose.yaml stop        tắt, giữ dữ liệu
#   docker compose -f infra/compose.yaml down -v     xoá cả dữ liệu, làm lại từ đầu

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    env_file: .env # đưa mật khẩu vào hộp cho db/init/01-roles.sh
    environment:
      POSTGRES_DB: ${DB_NAME:-cadence}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    image: cadence-api:dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local # có seed + log chữ cho máy cá nhân
      DB_HOST: postgres # tên service, không phải localhost
      DB_PORT: 5432 # cổng bên trong mạng Compose, không phải 15432
      DB_NAME: ${DB_NAME:-cadence}
      CADENCE_APP_PASSWORD: ${CADENCE_APP_PASSWORD}
      CADENCE_MIGRATOR_PASSWORD: ${CADENCE_MIGRATOR_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ../frontend
    image: cadence-web:dev
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080/api # gọi backend bằng tên service "api"
    depends_on:
      - api

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80" # cửa duy nhất mở ra ngoài
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
