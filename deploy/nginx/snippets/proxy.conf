# Shared by local.conf and prod.conf.template (included at http level, outside any server).

# Rate limiting as early as possible (architecture 6, SRS NFR-SEC-02). The application adds
# per-account limits on top (Bucket4j).
limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=lookup:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=voucher:10m rate=10r/m;
limit_req_status 429;

upstream frontend { server frontend:3000; }
upstream backend  { server backend:8080; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
