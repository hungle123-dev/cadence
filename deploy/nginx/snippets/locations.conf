# Routes shared by the local and production servers. Same origin for pages and API (no CORS).

client_max_body_size 1m;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
# WebSocket upgrade (Next.js dev tooling, future live features). Set here, not inside a location:
# like add_header, a proxy_set_header inside a location drops every inherited proxy_set_header.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 30s;

# Rate-limited API paths (they exist from M3 / M4 on).
location ~ ^/api/v1/account/.+/login$ {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://backend;
}
location = /api/v1/ordering/orders/lookup {
    limit_req zone=lookup burst=5 nodelay;
    proxy_pass http://backend;
}
location = /api/v1/ordering/cart/voucher {
    limit_req zone=voucher burst=5 nodelay;
    proxy_pass http://backend;
}

# Only health is public among actuator endpoints.
location /api/actuator/ {
    location = /api/actuator/health { proxy_pass http://backend; }
    return 404;
}

location /api/ {
    proxy_pass http://backend;
}

# Next.js build assets have content hashes in their names. Next.js itself already answers with
# "Cache-Control: public, max-age=31536000, immutable", so Nginx adds nothing here.
#
# Rule for this file: never use add_header or proxy_set_header inside a location. Either one in a
# location makes Nginx DROP all of that directive inherited from outside (security headers, HSTS
# in prod; Host and X-Forwarded-* for the proxied app).
location /_next/static/ {
    proxy_pass http://frontend;
}

location / {
    proxy_pass http://frontend;
}
