name: CI

on:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # lấy code của repo về máy runner
      - uses: actions/setup-java@v5 # cài JDK
        with:
          distribution: temurin
          java-version: "25"
          cache: maven # lưu thư viện Maven lại, lần sau build nhanh hơn
      - run: ./mvnw verify
        working-directory: backend
